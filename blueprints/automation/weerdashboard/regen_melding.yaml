blueprint:
  name: Weerdashboard - regenmelding
  description: >
    Stuurt een melding een aantal minuten voordat het gaat regenen, met de samenvatting en het kledingadvies van Weerdashboard.
    Na een melding wacht de automatisering tot de bui voorbij is, zodat je niet steeds opnieuw een melding krijgt.
  domain: automation
  input:
    rain_sensor:
      name: Sensor "Regen over"
      description: De Weerdashboard-sensor met het aantal minuten tot de regen begint (bijvoorbeeld sensor.weerdashboard_regen_over).
      selector:
        entity:
          filter:
            - domain: sensor
    summary_sensor:
      name: Sensor "Samenvatting"
      description: De Weerdashboard-sensor met de samenvatting (bijvoorbeeld sensor.weerdashboard_samenvatting).
      selector:
        entity:
          filter:
            - domain: sensor
    notify_service:
      name: Meldingsdienst
      description: De dienst waarmee je de melding krijgt, bijvoorbeeld notify.mobile_app_jouw_telefoon.
      default: notify.notify
      selector:
        text:
    minutes:
      name: Minuten vooraf
      description: Een melding als de regen binnen zoveel minuten begint.
      default: 30
      selector:
        number:
          min: 5
          max: 120
          unit_of_measurement: min
          mode: slider
    active_from:
      name: Meldingen vanaf
      default: "07:00:00"
      selector:
        time:
    active_until:
      name: Meldingen tot
      default: "22:00:00"
      selector:
        time:
mode: single
max_exceeded: silent
variables:
  rain_sensor: !input rain_sensor
  summary_sensor: !input summary_sensor
  minutes: !input minutes
triggers:
  - trigger: numeric_state
    entity_id: !input rain_sensor
    above: 0
    below: !input minutes
conditions:
  - condition: time
    after: !input active_from
    before: !input active_until
actions:
  - action: !input notify_service
    data:
      title: "Regen op komst"
      message: >
        Over {{ states(rain_sensor) | int(0) }} minuten begint het te regenen.
        {{ states(summary_sensor) }}
  - wait_template: >
      {{ not is_number(states(rain_sensor)) or states(rain_sensor) | float(0) == 0 or states(rain_sensor) | float(0) > (minutes | float(30)) + 15 }}
    timeout: "02:00:00"
    continue_on_timeout: true
